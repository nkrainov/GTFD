<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTFD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-inner">
    <a class="topbar-logo" href="#">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="4" fill="#89bf04"/>
        <path d="M8 18 L18 8 L28 18 L18 28 Z" fill="white" opacity="0.9"/>
        <circle cx="18" cy="18" r="4" fill="#1b1b1b"/>
      </svg>
      GTFD
    </a>
  </div>
</div>

<!-- Info header -->
<div class="info-header">
  <div class="info-inner">
    <h1 id="api-title">Loading... <span class="version-badge" id="api-version"></span></h1>
  </div>
</div>

<!-- Main -->
<div class="swagger-ui">

  <!-- Base URL -->
  <div class="base-url-bar">
    <label class="base-url-label" for="base-url-input">Server URL</label>
    <input type="text" id="base-url-input" placeholder="https://localhost:8080" spellcheck="false" />
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <input type="text" id="filter-input" placeholder="Filter by path..." />
  </div>

  <!-- Endpoints -->
  <div id="endpoints-container"></div>

  <!-- Models / Schemas -->
  <div class="models-section" id="models-section" style="display:none">
    <div class="models-toggle" id="models-toggle">
      <h4>Schemas</h4>
      <svg class="arrow" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
      </svg>
    </div>
    <div class="models-body" id="models-body"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
